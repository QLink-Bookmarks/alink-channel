name: PR 검사

# main 과 feat/**, refactor/**, fix/** 대상 PR 마다 Jest 단위 테스트를 실행한다.
# 스택 PR 의 대상이 그 패턴을 따라야 검사가 돈다 (branch-name.yaml).
# Playwright E2E 는 여기서 돌리지 않는다.
on:
  pull_request:
    branches:
      - main
      - "feat/**"
      - "refactor/**"
      - "fix/**"

jobs:
  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit
